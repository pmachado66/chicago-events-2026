:root{color-scheme:light;--bg:#f0f2f5;--card:#fff;--text:#1a1a1a;--muted:#666;--accent:#1a6fc4;--border:#e0e0e0;--pill:#e0e0e0;--pill-text:#444;--head:#f7f8fa}
body.dark{color-scheme:dark;--bg:#14161a;--card:#1e2126;--text:#e8e8e8;--muted:#9aa0a6;--accent:#5da9f5;--border:#333;--pill:#2c3037;--pill-text:#ccc;--head:#22262c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:17px;font-weight:700;color:var(--accent)}
#stamp{font-size:11px;color:var(--muted)}
.controls{display:flex;flex-direction:column;gap:7px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:500;background:var(--pill);color:var(--pill-text)}
.pill.active{background:var(--accent);color:#fff}
input[type=text],select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;outline:none}
#search{flex:1;min-width:0}
#count{font-size:12px;color:var(--muted);white-space:nowrap}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 12px}
table{border-collapse:collapse;width:100%;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
th{background:var(--head);cursor:pointer;user-select:none;white-space:nowrap;font-size:13px;position:sticky;top:0;z-index:2}
th:hover{color:var(--accent)}
th.noSort{cursor:default}
th.noSort:hover{color:inherit}
th .arrow{opacity:.4;font-size:11px}
th.sorted .arrow{opacity:1;color:var(--accent)}
tr.ev{cursor:pointer}
tr.ev:hover{background:var(--head)}
td.nowrap{white-space:nowrap}
td.name{font-weight:600}
td.name a{color:var(--text);text-decoration:none}
td.name a:hover{color:var(--accent)}
td a.map{color:var(--accent);text-decoration:none}
a.gcal{display:inline-block;white-space:nowrap;padding:4px 9px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;text-decoration:none}
a.gcal:hover{opacity:.85}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
tr.desc td{background:var(--head);font-size:13px;color:var(--muted);border-bottom:2px solid var(--border)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.tba{color:var(--muted);font-style:italic}
#sortbox{display:none}
.dlab{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
input[type=date]{padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;min-width:0}
#daterow.active-range{background:rgba(26,111,196,.08);border-radius:8px;padding:4px 6px}
table{table-layout:fixed}
th,td{overflow-wrap:break-word;word-break:break-word}
th{position:relative}
.resizer{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;z-index:4}
.resizer:hover,.resizer.active{background:var(--accent)}
.colsPanel{position:absolute;top:calc(100% + 4px);left:0;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:150;font-size:13px;display:flex;flex-direction:column;gap:7px;min-width:170px}
.colsPanel[hidden]{display:none}
.colsPanel label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--text)}
.colsPanel button{margin-top:2px}
.modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modalOverlay[hidden]{display:none}
.modalBox{background:var(--card);color:var(--text);max-width:480px;width:100%;padding:20px 22px;border-radius:12px;position:relative;font-size:13px;line-height:1.55;max-height:80vh;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.modalClose{position:absolute;top:8px;right:10px;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.modalClose:hover{color:var(--accent)}
@media(max-width:760px){
  .tablewrap{padding:6px}
  th,td{padding:6px 5px;font-size:12px}
  td.nowrap{white-space:normal}
  th{font-size:11px}
  #sortbox{display:flex}
  th:first-child,td:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  th:first-child{background:var(--head);z-index:3}
  h1{font-size:16px}
  a.gcal{padding:3px 6px;font-size:10px}
  .tag{padding:1px 6px;font-size:10px}
}
</style>

<header>

  <div class="controls">
    <div class="row">
      <button class="pill active" data-tf="upcoming" onclick="setTf('upcoming')">Upcoming</button>
      <button class="pill" data-tf="weekend" onclick="setTf('weekend')">This Weekend</button>
      <button class="pill" data-tf="past" onclick="setTf('past')">Past</button>

      <button class="pill" onclick="toggleDark()">&#9681;</button>
    </div>
    <div class="row"><input type="text" id="search" placeholder="Search events, venues, types&hellip;" oninput="render()"></div>
    <div class="row" id="daterow">
      <label class="dlab">From <input type="date" id="dFrom" autocomplete="off" onchange="dateChanged()"></label>

    </div>
    <div class="row">
      <select id="typeF" onchange="render()"><option value="">All types</option></select>
      <span id="sortbox" class="row">
        <select id="sortF" onchange="setSort(this.value,true)">
          <option value="date">Sort: Date</option>
          <option value="startTime">Sort: Start Time</option>
          <option value="endTime">Sort: End Time</option>
          <option value="name">Sort: Event</option>
          <option value="type">Sort: Type</option>
          <option value="cost">Sort: Cost</option>
        </select>
        <button class="pill" id="dirBtn" onclick="flipDir()">&uarr; Asc</button>
      </span>
      <span style="position:relative">
        <button class="pill" id="colsBtn" onclick="toggleColsPanel(event)">&#9881; Columns</button>
        <div id="colsPanel" class="colsPanel" hidden></div>
      </span>
      <button class="pill" id="infoBtn" onclick="toggleInfo()" title="About this list">&#9432; Info</button>
      <span id="count"></span>
    </div>
  </div>
</header>
<div class="tablewrap">
<table>

<thead id="thead"></thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

function defaultWidths(){return Object.assign({},window.matchMedia('(max-width:760px)').matches?DEFAULT_WIDTHS_MOBILE:DEFAULT_WIDTHS);}
function loadColState(){
  let saved=null;
  try{const raw=localStorage.getItem('cev2026_colstate');if(raw)saved=JSON.parse(raw);}catch(err){}
  const widths=Object.assign(defaultWidths(),(saved&&saved.widths)||{});
  const hidden=(saved&&saved.hidden)||{};
  return {widths,hidden};
}
function saveColState(){try{localStorage.setItem('cev2026_colstate',JSON.stringify(colState));}catch(err){}}
let colState=loadColState();

function visibleCols(){return COLS.filter(c=>!colState.hidden[c.key]);}

function renderHead(){
  const vis=visibleCols();
  const colgroup=document.getElementById('colgroup');
  colgroup.innerHTML=vis.map(c=>'<col style="width:'+colState.widths[c.key]+'px">').join('');
  const thead=document.getElementById('thead');
  const tr=document.createElement('tr');
  vis.forEach(c=>{
    const th=document.createElement('th');
    if(c.plain){
      th.className='noSort';
      th.innerHTML=c.label;
      if(c.title)th.title=c.title;
    } else {
      th.dataset.k=c.key;
      th.classList.toggle('sorted',sortKey===c.key);
      th.innerHTML=esc(c.label)+' <span class="arrow">&#8597;</span>';
      th.addEventListener('click',()=>setSort(c.key));
    }
    const rez=document.createElement('span');
    rez.className='resizer';
    rez.addEventListener('pointerdown',startResize(c.key));
    th.appendChild(rez);
    tr.appendChild(th);
  });
  thead.innerHTML='';
  thead.appendChild(tr);
}

function startResize(key){
  return function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    const resizer=ev.currentTarget;
    try{resizer.setPointerCapture(ev.pointerId);}catch(err){}
    const startX=ev.clientX, startWidth=colState.widths[key]||90;
    resizer.classList.add('active');
    function onMove(e){
      const dx=e.clientX-startX;
      const newW=Math.max(36,Math.round(startWidth+dx));
      colState.widths[key]=newW;
      const idx=visibleCols().findIndex(c=>c.key===key);
      const colEl=document.querySelectorAll('#colgroup col')[idx];
      if(colEl)colEl.style.width=newW+'px';
    }
    function onUp(){
      resizer.classList.remove('active');
      resizer.removeEventListener('pointermove',onMove);
      resizer.removeEventListener('pointerup',onUp);
      saveColState();
    }
    resizer.addEventListener('pointermove',onMove);
    resizer.addEventListener('pointerup',onUp);
  };
}

function toggleColsPanel(ev){

function buildColsPanel(){
  const p=document.getElementById('colsPanel');
  const labelFor=c=>c.key==='cal'?'Calendar link':c.label;
  p.innerHTML=COLS.map(c=>{
    const checked=colState.hidden[c.key]?'':'checked';

function toggleColVisible(key,visible){
  if(visible)delete colState.hidden[key]; else colState.hidden[key]=true;

  saveColState();
  renderHead();
  render();
}

}

function parseTime(t){
  if(!t) return null;
  const m=String(t).trim().match(/^~?(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(!m) return null;
  let h=+m[1]; const mi=+m[2]; const ap=m[3].toUpperCase();
  if(ap==='PM'&&h!==12) h+=12;
  if(ap==='AM'&&h===12) h=0;
  return h*60+mi;
}
function costVal(c){
  if(!c) return null;
  const s=String(c).toLowerCase();
  if(s.includes('free')) return 0;
  const m=s.replace(/,/g,'').match(/\$\s*(\d+(?:\.\d+)?)/);
  return m?parseFloat(m[1]):null;
}
function keyVal(e,k){
  if(k==='startTime'||k==='endTime') return parseTime(e[k]);
  if(k==='cost') return costVal(e.cost);
  if(k==='date') return e.date;
  return (e[k]||'').toLowerCase();
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekendISO(){const d=new Date(),day=d.getDay(),fri=new Date(d);fri.setDate(d.getDate()+(day<=5?5-day:5-day+7));const sun=new Date(fri);sun.setDate(fri.getDate()+2);const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');return[f(fri),f(sun)];}
function fmtDate(d){const[y,m,dd]=d.split('-');const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const dt=new Date(+y,+m-1,+dd);return dn[dt.getDay()]+', '+mn[+m-1]+' '+(+dd);}
function mapsUrl(a){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function gcalUrl(e){
  const [y,m,d]=e.date.split('-').map(Number);
  const sMin=parseTime(e.startTime);
  let url='https://calendar.google.com/calendar/render?action=TEMPLATE';
  url+='&text='+encodeURIComponent(e.name);
  let dates;
  if(sMin===null){
    const start=`${y}${pad(m)}${pad(d)}`;
    const nd=new Date(y,m-1,d+1);
    const end=`${nd.getFullYear()}${pad(nd.getMonth()+1)}${pad(nd.getDate())}`;
    dates=start+'/'+end;
  } else {
    let eMin=parseTime(e.endTime), endOff=0;
    if(eMin===null){ eMin=sMin+120; }
    else if(eMin<=sMin){ endOff=1; }
    let sH=Math.floor(sMin/60), sM=sMin%60;
    let eH=Math.floor(eMin/60), eM=eMin%60;
    const sd=new Date(y,m-1,d), ed=new Date(y,m-1,d+endOff);
    if(eH>=24){ ed.setDate(ed.getDate()+1); eH-=24; }
    const S=`${sd.getFullYear()}${pad(sd.getMonth()+1)}${pad(sd.getDate())}T${pad(sH)}${pad(sM)}00`;
    const E=`${ed.getFullYear()}${pad(ed.getMonth()+1)}${pad(ed.getDate())}T${pad(eH)}${pad(eM)}00`;
    dates=S+'/'+E;
    url+='&ctz=America/Chicago';
  }
  url+='&dates='+dates;
  url+='&location='+encodeURIComponent(e.address);
  const details=(e.description?e.description+'\n\n':'')+'Cost: '+e.cost+'\nEvent info: '+e.website;
  url+='&details='+encodeURIComponent(details);
  return url;
}

function clearDates(){document.getElementById('dFrom').value='';document.getElementById('dTo').value='';render();}
function render(){
  const today=todayISO(),[wf,ws]=weekendISO();
  const q=document.getElementById('search').value.toLowerCase();
  const tfil=document.getElementById('typeF').value;
  const dFrom=document.getElementById('dFrom').value, dTo=document.getElementById('dTo').value;
  document.getElementById('daterow').classList.toggle('active-range',!!(dFrom||dTo));
  let out=EVENTS.filter(e=>{
    if(tf==='upcoming'&&e.date<today)return false;
    if(tf==='past'&&e.date>=today)return false;
    if(tf==='weekend'&&(e.date<wf||e.date>ws))return false;
    if(dFrom&&e.date<dFrom)return false;
    if(dTo&&e.date>dTo)return false;
    if(tfil&&e.type!==tfil)return false;
    if(q&&!Object.values(e).join(' ').toLowerCase().includes(q))return false;
    return true;
  });
  out.sort((a,b)=>{
    const av=keyVal(a,sortKey),bv=keyVal(b,sortKey);
    const an=(av===null||av===undefined||av===''),bn=(bv===null||bv===undefined||bv==='');
    if(an&&bn){} else if(an) return 1; else if(bn) return -1;
    else if(av<bv) return -sortDir;
    else if(av>bv) return sortDir;
    if(a.date!==b.date) return a.date<b.date?-1:1;
    const at=parseTime(a.startTime),bt=parseTime(b.startTime);
    if(at!==null&&bt!==null&&at!==bt) return at-bt;
    return a.name<b.name?-1:a.name>b.name?1:0;
  });
  document.getElementById('count').textContent=out.length+' event'+(out.length===1?'':'s');
  const tb=document.getElementById('tbody');
  const vis=visibleCols();
  const span=vis.length||1;
  if(!out.length){tb.innerHTML='<tr><td colspan="'+span+'" class="empty">No events found.</td></tr>';return;}
  const tba=v=>parseTime(v)===null?'<span class="tba">'+esc(v)+'</span>':esc(v);
  function cellFor(e,key,col){
    switch(key){
      case 'date': return '<td class="nowrap">'+fmtDate(e.date)+'</td>';
      case 'cal': return '<td class="nowrap"><a class="gcal" href="'+gcalUrl(e)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">+ Cal</a></td>';
      case 'startTime': return '<td class="nowrap">'+tba(e.startTime)+'</td>';
      case 'endTime': return '<td class="nowrap">'+tba(e.endTime)+'</td>';
      case 'name': return '<td class="name"><a href="'+esc(e.website)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(e.name)+'</a></td>';
      case 'type': return '<td><span class="tag" style="background:'+col+'22;color:'+col+'">'+esc(e.type)+'</span></td>';
      case 'address': return '<td><a class="map" href="'+mapsUrl(e.address)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(e.address)+'</a></td>';
      case 'cost': return '<td>'+esc(e.cost)+'</td>';
      default: return '<td></td>';
    }
  }
  tb.innerHTML=out.map(e=>{
    const id=e.date+'|'+e.name, col=TYPE_COLORS[e.type];
    const main='<tr class="ev" onclick="tog(this)" data-id="'+esc(id)+'">'
      +vis.map(c=>cellFor(e,c.key,col)).join('')
      +'</tr>';
    const d=open.has(id)?'<tr class="desc"><td colspan="'+span+'">'+esc(e.description)+'</td></tr>':'';
    return main+d;
  }).join('');
}
function tog(tr){const id=tr.dataset.id;open.has(id)?open.delete(id):open.add(id);render();}
renderHead();
setSort('date',true);
</script>
